<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShreeVerse | Academic Portfolio & Research Documentation</title>
    <meta name="description" content="Academic profile, research projects, course documentation, certifications, and achievements of an 11th-grade high school student. Supporting academic growth, university admissions, and future research." />
    
    <!-- Open Graph / Social Sharing Preview -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ShreeVerse | Academic Portfolio & Research Documentation" />
    <meta property="og:description" content="Academic profile, research projects, course documentation, certifications, and achievements of an 11th-grade high school student. Supporting academic growth, university admissions, and future research." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1456513080510-7bf3a84b82f8?auto=format&fit=crop&q=80&w=1200" />
    <meta property="og:url" content="https://ai.studio/build" />

    <!-- Twitter Card metadata -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ShreeVerse | Academic Portfolio & Research Documentation" />
    <meta name="twitter:description" content="Academic profile, research projects, course documentation, certifications, and achievements of an 11th-grade high school student. Supporting academic growth, university admissions, and future research." />
    <meta name="twitter:image" content="https://images.unsplash.com/photo-1456513080510-7bf3a84b82f8?auto=format&fit=crop&q=80&w=1200" />

    <!-- Favicon link -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
    
    <style>
      @import "tailwindcss";
      
      :root {
        --cream: #FFFCF8;
        --ink: #1A181E;
        --lavender: #8A7DCB;
        --lavender-light: #F0EDFF;
        --gold: #C5A059;
        --charcoal: #4A454E;
        --border: #E8E5EC;
      }

      body {
        background-color: var(--cream);
        color: var(--ink);
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: var(--cream); }
      ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

      /* Typography */
      .font-serif { font-family: 'DM Serif Display', serif; }

      /* Buttons without @apply for custom colors */
      .premium-btn {
        background-color: var(--ink);
        color: white;
        padding: 0.75rem 2rem;
        border-radius: 9999px;
        font-weight: 700;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        box-shadow: 0 10px 15px -3px rgba(26, 24, 30, 0.1);
      }
      .premium-btn:hover { background-color: var(--lavender); transform: scale(1.05); }
      .premium-btn:active { transform: scale(0.95); }

      .secondary-btn {
        background-color: white;
        border: 1px solid var(--border);
        color: var(--charcoal);
        padding: 0.75rem 2rem;
        border-radius: 9999px;
        font-weight: 700;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        transition: all 0.3s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
      }
      .secondary-btn:hover { background-color: var(--lavender-light); border-color: var(--lavender); color: var(--lavender); }

      .input-field {
        width: 100%;
        background-color: var(--cream);
        border: 1px solid var(--border);
        padding: 1rem 1.5rem;
        border-radius: 1rem;
        outline: none;
        transition: all 0.3s;
      }
      .input-field:focus { border-color: var(--lavender); box-shadow: 0 0 0 4px rgba(138, 125, 203, 0.1); }

      .sidebar {
        width: 20rem;
        min-height: 100vh;
        background-color: white;
        border-right: 1px solid var(--border);
        padding: 2.5rem;
        display: flex;
        flex-direction: column;
        position: sticky;
        top: 0;
      }

      .main-content {
        flex: 1;
        padding: 2rem;
        background-color: var(--cream);
      }
      @media (min-width: 768px) { .main-content { padding: 5rem; } }

      .post-card {
        background-color: white;
        padding: 2.5rem;
        border-radius: 2.5rem;
        border: 1px solid var(--border);
        box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        transition: all 0.3s;
        display: flex;
        flex-direction: column;
      }
      .post-card:hover { transform: translateY(-0.5rem); box-shadow: 0 25px 50px -12px rgba(138, 125, 203, 0.05); }

      .tag {
        display: inline-flex;
        align-items: center;
        padding: 0.5rem 1rem;
        border-radius: 9999px;
        font-size: 0.625rem;
        text-transform: uppercase;
        font-weight: 700;
        letter-spacing: 0.15em;
        background-color: var(--lavender-light);
        color: var(--lavender);
        margin-bottom: 1rem;
      }

      .user-badge {
        border-radius: 9999px;
        background-color: var(--lavender-light);
        color: var(--lavender);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 0.75rem;
        border: 2px solid white;
        width: 2.5rem;
        height: 2.5rem;
      }

      .mobile-nav {
         position: fixed;
         bottom: 0; left: 0; right: 0;
         height: 5rem;
         background-color: rgba(255, 255, 255, 0.8);
         backdrop-filter: blur(20px);
         border-top: 1px solid var(--border);
         display: flex;
         align-items: center;
         justify-content: space-around;
         padding: 0 1rem;
         z-index: 40;
      }
      @media (min-width: 1024px) { .mobile-nav { display: none; } }

      .category-section-card {
        position: relative;
        height: 24rem;
        border-radius: 3rem;
        overflow: hidden;
        cursor: pointer;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        transition: all 0.3s;
      }
      .category-section-card:hover { transform: scale(1.02); }

      .category-overlay {
        position: absolute;
        inset: 0;
        background: linear-gradient(to top, var(--ink), transparent);
        padding: 2.5rem;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
      }

      .category-icon-circle {
        width: 3rem;
        height: 3rem;
        border-radius: 9999px;
        background-color: rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(8px);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 1rem;
      }

    </style>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="app" class="min-h-screen bg-[#F3F0FF] text-[#2D2438] font-sans">
      <!-- App content will be injected or managed via main.js -->
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
